[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qc-clock-model"
version = "0.1.0"
description = "Qiskit two-qubit circadian analogue: H0 baseline only"
requires-python = ">=3.11,<3.14"
dependencies = [
  "qiskit>=2.0,<3",
  "qiskit-aer>=0.17,<0.19",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
qc-clock = "qc_clock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_clock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
